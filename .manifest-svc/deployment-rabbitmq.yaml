apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: gg
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: docker.io/pangyuteng/ghettogex-rabbitmq:prod
        imagePullPolicy: Always
        ports:
        - containerPort: 5672
          name: web
          protocol: TCP
        - containerPort: 15672
          name: web-admin
          protocol: TCP